<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Schedule Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .calendar-grid {
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        /* For a better scrollbar on the modal */
        #modal-events::-webkit-scrollbar {
            width: 8px;
        }
        #modal-events::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        #modal-events::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        #modal-events::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-5xl">
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <!-- Calendar Header -->
            <div class="flex items-center justify-between p-4 md:p-6 border-b border-gray-200">
                <h1 class="text-xl md:text-2xl font-bold text-gray-800" id="month-year"></h1>
                <div class="flex items-center space-x-1 sm:space-x-2">
                    <button id="prev-month" class="p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button id="today" class="px-3 sm:px-4 py-2 text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Today</button>
                    <button id="next-month" class="p-2 rounded-full text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Calendar Body -->
            <div class="p-2 md:p-4">
                <!-- Days of the week -->
                <div class="grid calendar-grid text-center font-semibold text-xs text-gray-500 uppercase tracking-wider mb-2">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <!-- Calendar Dates -->
                <div id="calendar-grid" class="grid calendar-grid gap-1">
                    <!-- Day cells will be generated by JS -->
                </div>
            </div>
        </div>
        <footer class="text-center mt-4 text-sm text-gray-500">
            <p>Sichuan University. International Business Management Class Schedule.</p>
            <p>Made by Rokon</p>
        </footer>
    </div>

    <!-- Event Details Modal -->
    <div id="event-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md transform transition-all opacity-0 scale-95" id="modal-content">
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <h2 class="text-lg font-bold" id="modal-date"></h2>
                <button id="close-modal" class="p-2 rounded-full text-gray-400 hover:bg-gray-200 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="modal-events" class="p-4 md:p-6 max-h-[60vh] overflow-y-auto">
                <!-- Event details will be generated here -->
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- DATA FROM IMAGE ---
            // Based on the provided schedule for Autumn 2022
            const events = [
                // Customer Relation Management
                ...['9/11', '9/18', '9/25', '10/16', '10/23', '10/30', '11/6', '11/13', '11/20', '11/27', '12/4', '12/11'].map(date => ({
                    date: `2025/${date}`,
                    title: 'Customer Relation Management',
                    time: date === '9/18' ? '19:00 - 21:30' : '18:30 - 21:30',
                    location: date === '9/18' ? '206' : '402',
                    instructor: '廖成城',
                    color: 'blue'
                })),

                // Macroeconomics
                ...['9/11', '9/18', '9/25', '10/16', '10/23', '10/30', '11/6', '11/13', '11/20', '11/27', '12/4', '12/11'].map(date => ({
                    date: `2025/${date}`,
                    title: 'Macroeconomics',
                    time: '14:00 - 17:00',
                    location: '510',
                    instructor: '王克',
                    color: 'green'
                })),

                // Market Survey
                ...['9/10', '9/17', '9/24', '10/15', '10/22', '10/29', '11/5', '11/12', '11/19', '11/26', '12/3', '12/10'].map(date => ({
                    date: `2025/${date}`,
                    title: 'Market Survey',
                    time: '09:00 - 12:00',
                    location: '106',
                    instructor: '靳菲',
                    color: 'yellow'
                })),

                // Literature Reviewing and Thesis Writing
                ...['9/22', '9/29', '10/13', '10/20'].map(date => ({
                    date: `2025/${date}`,
                    title: 'Literature Reviewing and Thesis Writing',
                    time: '19:00 - 22:00',
                    location: '406',
                    instructor: '刘锐',
                    color: 'purple'
                })),

                // Business Model and Enterprise Innovation
                ...['9/19', '10/13', '10/15', '10/17', '10/20', '10/21'].map(date => ({
                    date: `2025/${date}`,
                    title: 'Business Model and Enterprise Innovation',
                    time: '13:00 - 17:00',
                    location: '302',
                    instructor: '孙含林',
                    color: 'red'
                }))
            ].sort((a, b) => { // Sort events by time for consistent display
                if (!a.time || !b.time) return 0;
                return a.time.localeCompare(b.time);
            });
            
            // Map events for quick lookup
            const eventsByDate = events.reduce((acc, event) => {
                const dateKey = new Date(event.date).toDateString();
                if (!acc[dateKey]) {
                    acc[dateKey] = [];
                }
                acc[dateKey].push(event);
                return acc;
            }, {});
            
            const colorClasses = {
                blue: { bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-400', bgHover: 'hover:bg-blue-200' },
                green: { bg: 'bg-green-100', text: 'text-green-800', border: 'border-green-400', bgHover: 'hover:bg-green-200' },
                yellow: { bg: 'bg-yellow-100', text: 'text-yellow-800', border: 'border-yellow-400', bgHover: 'hover:bg-yellow-200' },
                purple: { bg: 'bg-purple-100', text: 'text-purple-800', border: 'border-purple-400', bgHover: 'hover:bg-purple-200' },
                red: { bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-400', bgHover: 'hover:bg-red-200' },
            };

            // --- CALENDAR LOGIC ---
            const monthYearEl = document.getElementById('month-year');
            const calendarGridEl = document.getElementById('calendar-grid');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const todayBtn = document.getElementById('today');
            
            // --- MODAL LOGIC ---
            const eventModal = document.getElementById('event-modal');
            const modalContent = document.getElementById('modal-content');
            const closeModalBtn = document.getElementById('close-modal');
            const modalDateEl = document.getElementById('modal-date');
            const modalEventsEl = document.getElementById('modal-events');

            // Set initial date to Sep 2025 to show the schedule data
            let currentDate = new Date(2025, 8, 1);

            function renderCalendar() {
                calendarGridEl.innerHTML = '';
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                monthYearEl.textContent = `${currentDate.toLocaleString('en-US', { month: 'long' })} ${year}`;

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
                const lastDateOfPrevMonth = new Date(year, month, 0).getDate();

                // Days from previous month
                for (let i = firstDayOfMonth; i > 0; i--) {
                    const day = lastDateOfPrevMonth - i + 1;
                    const date = new Date(year, month - 1, day);
                    calendarGridEl.appendChild(createDayCell(day, date, false));
                }

                // Days of current month
                for (let i = 1; i <= lastDateOfMonth; i++) {
                    const date = new Date(year, month, i);
                    calendarGridEl.appendChild(createDayCell(i, date, true));
                }

                // Days from next month
                const totalCells = firstDayOfMonth + lastDateOfMonth;
                const nextMonthDays = (7 - totalCells % 7) % 7;
                for (let i = 1; i <= nextMonthDays; i++) {
                     const date = new Date(year, month + 1, i);
                    calendarGridEl.appendChild(createDayCell(i, date, false));
                }
            }
            
            function createDayCell(day, date, isCurrentMonth) {
                const cell = document.createElement('div');
                cell.className = `relative flex flex-col min-h-[100px] md:min-h-[120px] p-2 rounded-lg border transition-colors overflow-hidden ${isCurrentMonth ? 'bg-white border-gray-200' : 'bg-gray-50 border-transparent text-gray-400'}`;
                
                const dayWrapper = document.createElement('div');
                dayWrapper.className = 'flex justify-end';

                const dayNumber = document.createElement('span');
                dayNumber.textContent = day;
                dayNumber.className = 'text-sm font-semibold mb-1 w-7 h-7 flex items-center justify-center rounded-full';
                
                if (isToday(date) && isCurrentMonth) {
                     dayNumber.classList.add('bg-blue-600', 'text-white');
                } else if (isCurrentMonth) {
                     dayNumber.classList.add('text-gray-700');
                } else {
                    dayNumber.classList.add('text-gray-400');
                }
                
                dayWrapper.appendChild(dayNumber);
                cell.appendChild(dayWrapper);
                
                const eventsOnDay = eventsByDate[date.toDateString()];
                if (eventsOnDay && isCurrentMonth) {
                    cell.classList.add('cursor-pointer', 'hover:bg-gray-50');
                    
                    const eventsContainer = document.createElement('div');
                    eventsContainer.className = 'flex-grow overflow-y-auto text-xs space-y-1';
                    
                    eventsOnDay.slice(0, 2).forEach(event => { // Show max 2 events initially
                        const colors = colorClasses[event.color];
                        const eventEl = document.createElement('div');
                        eventEl.className = `p-1 rounded ${colors.bg} ${colors.text} font-medium truncate`;
                        eventEl.textContent = event.title;
                        eventsContainer.appendChild(eventEl);
                    });

                    if (eventsOnDay.length > 2) {
                        const moreEl = document.createElement('div');
                        moreEl.className = 'text-gray-500 font-medium text-center text-[11px] mt-1';
                        moreEl.textContent = `+${eventsOnDay.length - 2} more`;
                        eventsContainer.appendChild(moreEl);
                    }
                    
                    cell.appendChild(eventsContainer);
                    
                    cell.addEventListener('click', () => showEventModal(date, eventsOnDay));
                }
                
                return cell;
            }

            function isToday(date) {
                const today = new Date();
                return date.getDate() === today.getDate() &&
                       date.getMonth() === today.getMonth() &&
                       date.getFullYear() === today.getFullYear();
            }
            
            function showEventModal(date, events) {
                modalDateEl.textContent = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
                modalEventsEl.innerHTML = '';
                
                events.forEach(event => {
                    const colors = colorClasses[event.color];
                    const eventCard = document.createElement('div');
                    eventCard.className = `p-4 rounded-lg mb-3 last:mb-0 border-l-4 ${colors.bg} ${colors.border}`;
                    
                    eventCard.innerHTML = `
                        <h3 class="font-bold ${colors.text} text-base">${event.title}</h3>
                        <div class="mt-2 text-sm text-gray-600 space-y-1">
                            <p><strong class="font-semibold text-gray-800">Time:</strong> ${event.time}</p>
                            <p><strong class="font-semibold text-gray-800">Location:</strong> ${event.location}</p>
                            <p><strong class="font-semibold text-gray-800">Instructor:</strong> ${event.instructor}</p>
                        </div>
                    `;
                    modalEventsEl.appendChild(eventCard);
                });
                
                eventModal.classList.remove('hidden');
                eventModal.classList.add('flex');
                setTimeout(() => {
                    modalContent.classList.add('opacity-100', 'scale-100');
                    modalContent.classList.remove('opacity-0', 'scale-95');
                }, 10);
            }

            function hideEventModal() {
                 modalContent.classList.remove('opacity-100', 'scale-100');
                 modalContent.classList.add('opacity-0', 'scale-95');
                 setTimeout(() => {
                    eventModal.classList.add('hidden');
                    eventModal.classList.remove('flex');
                }, 200); // Match transition duration
            }

            // --- Event Listeners ---
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });
            
            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                renderCalendar();
            });

            closeModalBtn.addEventListener('click', hideEventModal);
            eventModal.addEventListener('click', (e) => {
                if (e.target === eventModal) {
                    hideEventModal();
                }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !eventModal.classList.contains('hidden')) {
                    hideEventModal();
                }
            });

            // Initial Render
            renderCalendar();
        });
    </script>
</body>
</html>
