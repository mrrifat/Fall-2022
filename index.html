<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class Schedule Calendar</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; }
    .calendar-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .day-cell { min-height: 78px; }
    /* modal scrollbar */
    #modal-events::-webkit-scrollbar { width: 8px; }
    #modal-events::-webkit-scrollbar-thumb { background: rgba(100,116,139,.4); border-radius:6px; }
    /* small helper */
    .truncate-1 { display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto p-4">
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b">
        <div class="flex items-center gap-3">
          <button id="prev-month" class="p-2 rounded-md hover:bg-gray-100" title="Previous month">
            <svg class="w-4 h-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <div>
            <div id="month-year" class="text-sm font-semibold text-gray-800"></div>
            <div id="range-summary" class="text-xs text-gray-500">Click a day to view events</div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="today" class="text-xs px-3 py-1 rounded-md bg-indigo-600 text-white hover:bg-indigo-700">Today</button>
          <button id="next-month" class="p-2 rounded-md hover:bg-gray-100" title="Next month">
            <svg class="w-4 h-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="grid calendar-grid text-center text-xs font-medium text-gray-500 bg-gray-50 px-3 py-2">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>

      <div id="calendar-grid" class="grid calendar-grid gap-2 p-3">
        <!-- days generated by JS -->
      </div>
    </div>

    <p class="mt-3 text-center text-xs text-gray-500">Sichuan University — International Business Management. Made by Rokon</p>
  </div>

  <!-- Modal -->
  <div id="event-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 p-4">
    <div id="modal-content" class="w-full max-w-md bg-white rounded-lg shadow transform transition duration-150 opacity-0 scale-95 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b">
        <div>
          <div id="modal-date" class="text-sm font-semibold text-gray-800"></div>
          <div id="modal-sub" class="text-xs text-gray-500"></div>
        </div>
        <button id="close-modal" class="p-2 rounded-md text-gray-600 hover:bg-gray-100">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-events" class="p-4 max-h-64 overflow-y-auto text-sm">
        <!-- event cards -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Data (kept from original schedule) ---
      const pad = n => String(n).padStart(2,'0');
      const crm = ['9/11','9/18','9/25','10/16','10/23','10/30','11/6','11/13','11/20','11/27','12/4','12/11'];
      const macro = crm.slice();
      const market = ['9/10','9/17','9/24','10/15','10/22','10/29','11/5','11/12','11/19','11/26','12/3','12/10'];
      const lit = ['9/22','9/29','10/13','10/20'];
      const bm = ['9/19','10/13','10/15','10/17','10/20','10/21'];

      function build(dates, year, meta) {
        return dates.map(s => {
          const [m, day] = s.split('/').map(Number);
          return Object.assign({ dateISO: `${year}-${pad(m)}-${pad(day)}` }, meta);
        });
      }

      const YEAR = 2025;
      const events = [
        ...build(crm, YEAR, { title: 'Customer Relation Management', time: '18:30 - 21:30', location: '402', instructor: '廖成城', color: 'blue' })
          .map(e => e.dateISO === `${YEAR}-09-18` ? Object.assign({}, e, { time: '19:00 - 21:30', location: '206' }) : e),
        ...build(macro, YEAR, { title: 'Macroeconomics', time: '14:00 - 17:00', location: '510', instructor: '王克', color: 'green' }),
        ...build(market, YEAR, { title: 'Market Survey', time: '09:00 - 12:00', location: '106', instructor: '靳菲', color: 'amber' }),
        ...build(lit, YEAR, { title: 'Literature Reviewing and Thesis Writing', time: '19:00 - 22:00', location: '406', instructor: '刘锐', color: 'purple' }),
        ...build(bm, YEAR, { title: 'Business Model and Enterprise Innovation', time: '13:00 - 17:00', location: '302', instructor: '孙含林', color: 'red' })
      ];

      // map by date string
      const eventsByDate = events.reduce((acc,e) => {
        const d = new Date(e.dateISO + 'T00:00:00');
        const k = d.toDateString();
        acc[k] = acc[k] || [];
        acc[k].push(Object.assign({}, e, { dateObj: d }));
        return acc;
      }, {});
      Object.values(eventsByDate).forEach(arr => arr.sort((a,b) => (a.time||'').localeCompare(b.time||'')));

      const colorMap = {
        blue: 'bg-blue-100 text-blue-800 border-blue-300',
        green: 'bg-green-100 text-green-800 border-green-300',
        amber: 'bg-amber-100 text-amber-800 border-amber-300',
        purple: 'bg-purple-100 text-purple-800 border-purple-300',
        red: 'bg-red-100 text-red-800 border-red-300'
      };

      // --- DOM refs ---
      const monthYearEl = document.getElementById('month-year');
      const rangeSummaryEl = document.getElementById('range-summary');
      const grid = document.getElementById('calendar-grid');
      const prevBtn = document.getElementById('prev-month');
      const nextBtn = document.getElementById('next-month');
      const todayBtn = document.getElementById('today');

      const modal = document.getElementById('event-modal');
      const modalContent = document.getElementById('modal-content');
      const closeModal = document.getElementById('close-modal');
      const modalDate = document.getElementById('modal-date');
      const modalSub = document.getElementById('modal-sub');
      const modalEvents = document.getElementById('modal-events');

      // Start on user's current month
      let current = new Date();

      function render() {
        grid.innerHTML = '';
        const y = current.getFullYear();
        const m = current.getMonth();

        monthYearEl.textContent = current.toLocaleString(undefined, { month: 'long', year: 'numeric' });

        // count events in month
        const start = new Date(y, m, 1), end = new Date(y, m+1, 0);
        let cnt = 0;
        for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
          const k = new Date(d).toDateString();
          if (eventsByDate[k]) cnt += eventsByDate[k].length;
        }
        rangeSummaryEl.textContent = `${cnt} event${cnt !== 1 ? 's' : ''} this month`;

        const firstDay = new Date(y, m, 1).getDay();
        const lastDate = new Date(y, m+1, 0).getDate();
        const prevLast = new Date(y, m, 0).getDate();

        // previous month's tail
        for (let i = firstDay; i > 0; i--) {
          const day = prevLast - i + 1;
          const date = new Date(y, m-1, day);
          grid.appendChild(makeCell(day, date, false));
        }

        // current month
        for (let d = 1; d <= lastDate; d++) {
          const date = new Date(y, m, d);
          grid.appendChild(makeCell(d, date, true));
        }

        // next month's head
        const total = firstDay + lastDate;
        const nextDays = (7 - total % 7) % 7;
        for (let d = 1; d <= nextDays; d++) {
          const date = new Date(y, m+1, d);
          grid.appendChild(makeCell(d, date, false));
        }
      }

      function makeCell(num, date, inMonth) {
        const key = date.toDateString();
        const dayEvents = eventsByDate[key] || [];

        const cell = document.createElement('div');
        cell.className = 'day-cell rounded-md p-2 bg-white border hover:shadow-sm transition text-xs flex flex-col justify-start';
        if (!inMonth) cell.classList.add('opacity-60', 'bg-gray-50');

        // top: day number + dot if events
        const top = document.createElement('div');
        top.className = 'flex items-start justify-between';

        const numEl = document.createElement('div');
        numEl.className = 'text-sm font-semibold';
        const today = new Date();
        if (date.getDate()===today.getDate() && date.getMonth()===today.getMonth() && date.getFullYear()===today.getFullYear()) {
          numEl.classList.add('px-2','py-0.5','rounded','bg-indigo-600','text-white','text-[12px]');
        } else {
          numEl.classList.add('text-gray-700');
        }
        numEl.textContent = num;
        top.appendChild(numEl);

        if (dayEvents.length) {
          const dot = document.createElement('div');
          dot.className = 'text-[11px] text-gray-500';
          dot.textContent = `${dayEvents.length}`;
          top.appendChild(dot);
          cell.classList.add('cursor-pointer');
        }
        cell.appendChild(top);

        // events list (compact: up to 2)
        if (dayEvents.length) {
          const list = document.createElement('div');
          list.className = 'mt-2 flex flex-col gap-1';

          dayEvents.slice(0,2).forEach(ev => {
            const badge = document.createElement('div');
            const classes = colorMap[ev.color] || colorMap.blue;
            badge.className = `flex items-center gap-2 p-1 rounded text-[12px] ${classes} border-l-4`;
            badge.title = `${ev.title} • ${ev.time} • ${ev.location}`;

            const colorDot = document.createElement('span');
            colorDot.className = 'w-2 h-2 rounded-full';
            if (ev.color==='blue') colorDot.classList.add('bg-blue-600');
            if (ev.color==='green') colorDot.classList.add('bg-green-600');
            if (ev.color==='amber') colorDot.classList.add('bg-amber-600');
            if (ev.color==='purple') colorDot.classList.add('bg-purple-600');
            if (ev.color==='red') colorDot.classList.add('bg-red-600');

            const txt = document.createElement('span');
            txt.className = 'truncate-1';
            txt.textContent = ev.title;

            badge.appendChild(colorDot);
            badge.appendChild(txt);
            list.appendChild(badge);
          });

          if (dayEvents.length > 2) {
            const more = document.createElement('div');
            more.className = 'text-xs text-gray-500 mt-1';
            more.textContent = `+${dayEvents.length-2} more`;
            list.appendChild(more);
          }
          cell.appendChild(list);

          cell.addEventListener('click', () => openModal(date, dayEvents));
        }

        return cell;
      }

      function openModal(date, events) {
        modalDate.textContent = date.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
        modalSub.textContent = `${events.length} event${events.length!==1?'s':''}`;
        modalEvents.innerHTML = '';
        events.forEach(ev => {
          const wrap = document.createElement('div');
          wrap.className = 'mb-3 p-3 rounded border-l-4 bg-white text-sm';
          const cls = colorMap[ev.color] ? colorMap[ev.color].split(' ')[0] : 'bg-blue-100';
          wrap.className += ' ' + (colorMap[ev.color] ? colorMap[ev.color] : colorMap.blue) + ' border-l-4';
          wrap.innerHTML = `<div class="font-semibold text-gray-800">${ev.title}</div>
                            <div class="text-xs text-gray-600 mt-1">${ev.time} • ${ev.location} • ${ev.instructor}</div>`;
          modalEvents.appendChild(wrap);
        });

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(()=> {
          modalContent.classList.remove('opacity-0','scale-95');
          modalContent.classList.add('opacity-100','scale-100');
        }, 10);
      }

      function close() {
        modalContent.classList.remove('opacity-100','scale-100');
        modalContent.classList.add('opacity-0','scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }, 150);
      }

      // listeners
      prevBtn.addEventListener('click', () => { current.setMonth(current.getMonth()-1); render(); });
      nextBtn.addEventListener('click', () => { current.setMonth(current.getMonth()+1); render(); });
      todayBtn.addEventListener('click', () => { current = new Date(); render(); });

      closeModal.addEventListener('click', close);
      modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.classList.contains('hidden')) close(); });

      // initial render
      render();
    });
  </script>
</body>
</html>
